name: Supabase keepalive
on:
  schedule:
    - cron: '0 9 */2 * *' # cada 2 días a las 9:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Petición a la base de datos
        run: |
          curl -f -sS "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
